name: plugins-check

# Verifies plugins/ and .claude-plugin/marketplace.json are in sync with the
# hand-authored sources (skills/*/SKILL.md, connectors.json, plugins.json).
# scripts/build-plugins.mjs has no runtime dependencies, so this runs on a
# bare Node checkout — no package install needed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-plugins.mjs --check
